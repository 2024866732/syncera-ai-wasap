model:
  default: deepseek-v4-flash
  provider: commandcode
  base_url: https://api.commandcode.ai/provider/v1
  api_mode: chat_completions
providers:
  commandcode:
    models:
      easy: mimo-v2.5
      simple: deepseek-v4-flash
      complex: glm-5.2
      critical: gpt-5.6-sol
      free: ox-alpha
_config_version: 38
default_provider: commandcode
env:
  CMD_API_KEY: ${COMMANDCODE_API_KEY}
  COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY}
  CMD_ZDR: '1'
mcp_servers:
  vercel:
    url: https://mcp.vercel.com
    auth: oauth
    enabled: true
onboarding:
  seen:
    busy_input_prompt: true
