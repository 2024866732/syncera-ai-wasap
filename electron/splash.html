<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SYNCERA</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #41ff78;
    --green-soft: rgba(65,255,120,.58);
    --green-dim: rgba(65,255,120,.18);
    --cyan: #bfffea;
    --ink: #030807;
    --glass: rgba(5,18,17,.62);
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-app-region: drag;
  }

  body {
    display: grid;
    place-items: center;
    perspective: 1400px;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 34px;
    background:
      radial-gradient(circle at 88% 10%, rgba(210,245,255,.22), transparent 26%),
      radial-gradient(circle at 48% 42%, rgba(65,255,120,.22), transparent 28%),
      radial-gradient(circle at 14% 68%, rgba(65,255,120,.12), transparent 28%),
      linear-gradient(125deg, #020303 0%, #07130f 40%, #101b1f 74%, #020404 100%);
    box-shadow:
      0 40px 120px rgba(0,0,0,.74),
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 22px 90px rgba(65,255,120,.18);
    transform-style: preserve-3d;
    isolation: isolate;
    animation: cameraDrift 10s cubic-bezier(.16,.84,.16,1) both;
  }

  @keyframes cameraDrift {
    0% { opacity: 0; transform: scale(.965) translateZ(-80px) rotateX(2deg); filter: blur(10px); }
    10% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: scale(1.035) translateZ(0) rotateX(0); }
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 1px, transparent 1px 5px),
      linear-gradient(108deg, transparent 18%, rgba(255,255,255,.13) 28%, transparent 40%);
    background-position: 0 0, -420px 0;
    opacity: .34;
    mix-blend-mode: screen;
    animation: scanLines 6.5s linear infinite;
  }

  @keyframes scanLines {
    to { background-position: 0 34px, 560px 0; }
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: -12%;
    z-index: 40;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 48%, transparent 46%, rgba(0,0,0,.68) 100%),
      linear-gradient(180deg, rgba(255,255,255,.08), transparent 18%, transparent 76%, rgba(0,0,0,.35));
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  .panel {
    position: absolute;
    left: 5%;
    right: 5%;
    top: 7%;
    bottom: 7%;
    z-index: 4;
    border-radius: 28px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.10), transparent 28%, rgba(255,255,255,.045)),
      var(--glass);
    border: 1px solid rgba(90,255,145,.36);
    box-shadow:
      0 25px 80px rgba(0,0,0,.35),
      0 0 0 1px rgba(65,255,120,.18) inset,
      0 0 34px rgba(65,255,120,.20) inset,
      0 1px 0 rgba(255,255,255,.20) inset,
      0 0 24px rgba(65,255,120,.36);
    backdrop-filter: blur(20px) saturate(1.22);
    animation: panelIn 1s .25s cubic-bezier(.18,1,.22,1) both;
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(18px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .panel-glow {
    position: absolute;
    inset: -12%;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 56%, rgba(65,255,120,.18), transparent 34%),
      radial-gradient(circle at 90% 15%, rgba(210,245,255,.16), transparent 28%);
    filter: blur(8px);
  }

  .hud-left, .hud-right {
    position: absolute;
    z-index: 12;
    top: 17%;
    color: rgba(232,255,242,.84);
    text-transform: uppercase;
    letter-spacing: 2.5px;
    text-shadow: 0 0 18px rgba(65,255,120,.28);
  }

  .hud-left { left: 7.7%; }
  .hud-right { right: 7.7%; text-align: right; }

  .hud-title {
    font-size: 16px;
    letter-spacing: 4px;
    margin-bottom: 7px;
  }

  .hud-small {
    font-size: 9px;
    color: rgba(65,255,120,.74);
    letter-spacing: 1.8px;
    margin-bottom: 24px;
  }

  .system-list {
    display: grid;
    gap: 14px;
  }

  .system-row {
    position: relative;
    padding-left: 18px;
    font-size: 9px;
    line-height: 1.35;
    color: rgba(65,255,120,.58);
  }

  .system-row::before {
    content: "";
    position: absolute;
    left: 0;
    top: 4px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
  }

  .system-row span {
    display: block;
    color: rgba(218,255,232,.48);
    letter-spacing: 1.4px;
  }

  .right-bars {
    display: grid;
    justify-items: end;
    gap: 8px;
    margin-top: 46px;
  }

  .right-bars i {
    width: 72px;
    height: 4px;
    display: block;
    background: linear-gradient(90deg, transparent, rgba(65,255,120,.48));
    box-shadow: 0 0 14px rgba(65,255,120,.20);
  }

  .sync {
    margin-top: 118px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    color: rgba(65,255,120,.62);
    font-size: 9px;
    letter-spacing: 1.4px;
  }

  .sync-ring {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(65,255,120,.38);
    box-shadow: 0 0 20px rgba(65,255,120,.18) inset;
    position: relative;
    animation: rotate 5s linear infinite;
  }

  .sync-ring::before, .sync-ring::after {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1px solid rgba(65,255,120,.35);
    border-left-color: transparent;
  }

  .sync-ring::after {
    inset: 14px;
    background: var(--green);
    box-shadow: 0 0 14px var(--green);
    border: 0;
  }

  .holo {
    position: absolute;
    z-index: 7;
    left: 50%;
    top: 43%;
    width: 520px;
    height: 520px;
    transform: translate(-50%, -50%) rotateX(58deg) rotateZ(-9deg);
    transform-style: preserve-3d;
    animation: holoIn 1.1s .45s cubic-bezier(.18,1,.22,1) both;
  }

  @keyframes holoIn {
    from { opacity: 0; transform: translate(-50%, -50%) rotateX(64deg) rotateZ(-18deg) scale(.82); }
    to { opacity: 1; transform: translate(-50%, -50%) rotateX(58deg) rotateZ(-9deg) scale(1); }
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    inset: 0;
    border: 1px solid rgba(65,255,120,.20);
    box-shadow: 0 0 32px rgba(65,255,120,.11) inset;
  }

  .ring.one {
    border-left-color: rgba(65,255,120,.72);
    border-top-color: rgba(181,255,213,.62);
    animation: rotate 18s linear infinite;
  }

  .ring.two {
    inset: 54px;
    border-right-color: rgba(65,255,120,.64);
    border-bottom-color: rgba(65,255,120,.36);
    animation: rotate 13s linear reverse infinite;
  }

  .ring.three {
    inset: 124px;
    border-color: rgba(65,255,120,.32);
    animation: breathe 3.2s ease-in-out infinite;
  }

  .arc {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 6px solid transparent;
    border-top-color: rgba(132,255,181,.92);
    border-left-color: rgba(65,255,120,.36);
    filter: drop-shadow(0 0 13px rgba(65,255,120,.84));
    animation: rotate 9.5s linear infinite;
  }

  .arc.two {
    inset: 82px;
    border-width: 4px;
    border-top-color: rgba(65,255,120,.82);
    border-left-color: transparent;
    border-bottom-color: rgba(65,255,120,.30);
    animation-duration: 7s;
    animation-direction: reverse;
  }

  .ticks {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: repeating-conic-gradient(from 3deg, rgba(65,255,120,.75) 0deg 1.1deg, transparent 1.1deg 4.2deg);
    mask: radial-gradient(circle, transparent 66%, #000 66.5%, #000 70%, transparent 70.5%);
    opacity: .72;
    animation: rotate 22s linear infinite;
  }

  @keyframes rotate { to { transform: rotate(360deg); } }

  @keyframes breathe {
    0%, 100% { transform: scale(.96); opacity: .42; }
    50% { transform: scale(1.06); opacity: .95; }
  }

  .wave-layer {
    position: absolute;
    z-index: 9;
    left: 0;
    right: 0;
    top: 43%;
    height: 190px;
    pointer-events: none;
    opacity: .95;
    transform: translateY(-50%);
    filter: drop-shadow(0 0 18px rgba(65,255,120,.56));
  }

  .wave-layer svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .wave-path {
    fill: none;
    stroke: rgba(91,255,134,.86);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 9 7;
    animation: waveDash 1.4s linear infinite;
  }

  .wave-path.main {
    stroke-width: 4;
    stroke: rgba(150,255,183,.95);
    stroke-dasharray: none;
    filter: drop-shadow(0 0 12px rgba(65,255,120,.95));
  }

  .wave-path.faint {
    opacity: .38;
    transform: translateY(-18px);
  }

  .wave-path.low {
    opacity: .28;
    transform: translateY(18px);
  }

  @keyframes waveDash { to { stroke-dashoffset: -32; } }

  .content {
    position: absolute;
    inset: 0;
    z-index: 16;
    display: grid;
    place-items: center;
    transform-style: preserve-3d;
    animation: parallax 7s 2s ease-in-out infinite;
  }

  @keyframes parallax {
    0%, 100% { transform: rotateY(-1.8deg) rotateX(.8deg) translateY(0); }
    50% { transform: rotateY(2deg) rotateX(-.8deg) translateY(-5px); }
  }

  .icon {
    position: absolute;
    top: 22%;
    left: 50%;
    width: 274px;
    height: 274px;
    transform: translateX(-50%) translateZ(56px);
    border-radius: 54px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.60), rgba(255,255,255,.10) 23%, transparent 42%),
      radial-gradient(circle at 34% 16%, rgba(255,255,255,.42), transparent 22%),
      linear-gradient(150deg, #151d1b 0%, #0d1916 38%, #07100f 100%);
    border: 2px solid rgba(152,255,186,.92);
    box-shadow:
      0 38px 70px rgba(0,0,0,.64),
      0 0 0 1px rgba(255,255,255,.16) inset,
      0 0 44px rgba(65,255,120,.92),
      0 -30px 58px rgba(0,0,0,.64) inset,
      0 26px 50px rgba(65,255,120,.25) inset;
    overflow: hidden;
    animation: iconIn 1.25s .85s cubic-bezier(.17,1,.22,1) both;
  }

  @keyframes iconIn {
    from { opacity: 0; transform: translateX(-50%) translateY(42px) translateZ(-60px) scale(.82) rotateX(18deg); filter: blur(12px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) translateZ(56px) scale(1) rotateX(0); filter: blur(0); }
  }

  .icon::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 45px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.22), transparent 36%, rgba(65,255,120,.10)),
      radial-gradient(circle at 50% 60%, rgba(65,255,120,.18), transparent 52%);
    box-shadow: 0 1px 0 rgba(255,255,255,.24) inset;
  }

  .icon::after {
    content: "";
    position: absolute;
    left: 18px;
    right: 18px;
    top: 8px;
    height: 82px;
    border-radius: 50%;
    background: rgba(255,255,255,.26);
    filter: blur(10px);
    transform: rotate(-8deg);
  }

  .mark {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 50%;
    width: 220px;
    height: 152px;
    transform: translate(-50%, -50%);
    filter:
      drop-shadow(0 0 7px rgba(255,255,255,.95))
      drop-shadow(0 0 18px rgba(65,255,120,.95))
      drop-shadow(0 0 38px rgba(65,255,120,.54));
  }

  .mark path {
    stroke-dasharray: 540;
    stroke-dashoffset: 540;
    animation: drawMark 1.15s 1.15s cubic-bezier(.24,0,.12,1) forwards, markGlow 2.6s 2.3s ease-in-out infinite;
  }

  @keyframes drawMark { to { stroke-dashoffset: 0; } }

  @keyframes markGlow {
    0%, 100% { opacity: .94; }
    50% { opacity: 1; filter: drop-shadow(0 0 10px white); }
  }

  .word {
    position: absolute;
    left: 50%;
    bottom: 22.5%;
    transform: translateX(-50%) translateZ(100px);
    display: flex;
    align-items: flex-end;
    gap: 6px;
    animation: wordIn 1.15s 1.45s cubic-bezier(.16,1,.22,1) both;
  }

  @keyframes wordIn {
    from { opacity: 0; transform: translateX(-50%) translateY(40px) translateZ(40px) rotateX(18deg); filter: blur(9px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) translateZ(100px) rotateX(0); filter: blur(0); }
  }

  .letter {
    position: relative;
    display: inline-block;
    font-size: 104px;
    line-height: .72;
    font-weight: 950;
    letter-spacing: -3px;
    font-style: italic;
    color: #eafff1;
    transform: skewX(-8deg);
    text-shadow:
      0 1px 0 #ffffff,
      0 3px 0 #b7c8c1,
      0 6px 0 #63756f,
      0 10px 0 #14241e,
      7px 13px 0 rgba(5,255,97,.55),
      0 18px 32px rgba(0,0,0,.70),
      0 0 36px rgba(65,255,120,.72);
  }

  .letter::before {
    content: attr(data-l);
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(180deg, #ffffff 0%, #e8fff1 28%, #9faea8 55%, #38413e 83%, #dffff0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .letter::after {
    content: attr(data-l);
    position: absolute;
    left: 8px;
    top: 12px;
    z-index: -1;
    color: rgba(0,0,0,.62);
    filter: blur(4px);
    transform: translateY(16px) scaleY(.78);
  }

  .floor {
    position: absolute;
    z-index: 8;
    left: 50%;
    bottom: 6%;
    width: 860px;
    height: 170px;
    transform: translateX(-50%) rotateX(72deg);
    border-radius: 50%;
    background:
      radial-gradient(ellipse at center, rgba(65,255,120,.34), rgba(65,255,120,.10) 34%, transparent 66%),
      repeating-radial-gradient(circle at center, rgba(65,255,120,.20) 0 1px, transparent 1px 22px);
    filter: blur(.2px);
    opacity: .78;
  }

  .loading {
    position: absolute;
    z-index: 22;
    left: 50%;
    bottom: 15.2%;
    width: 520px;
    transform: translateX(-50%);
    opacity: 0;
    animation: loadingIn .7s 2.2s ease-out forwards;
  }

  @keyframes loadingIn {
    to { opacity: 1; }
  }

  .track {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    overflow: visible;
    background: linear-gradient(90deg, transparent, rgba(65,255,120,.60), transparent);
  }

  .bar {
    position: absolute;
    inset: 0 auto 0 0;
    width: 100%;
    height: 3px;
    top: -1px;
    background: linear-gradient(90deg, transparent, var(--green), #bffff0, transparent);
    box-shadow: 0 0 22px var(--green);
    transform-origin: left;
    animation: progress 9.2s .45s cubic-bezier(.18,.78,.18,1) both;
  }

  @keyframes progress {
    0% { transform: scaleX(0); }
    18% { transform: scaleX(.22); }
    42% { transform: scaleX(.48); }
    72% { transform: scaleX(.80); }
    100% { transform: scaleX(1); }
  }

  .status {
    position: relative;
    margin-top: 0;
    text-align: center;
    color: rgba(229,255,238,.86);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(65,255,120,.66);
  }

  .outer-frame {
    position: absolute;
    inset: 30px;
    z-index: 18;
    pointer-events: none;
    border-radius: 28px;
    border: 1px solid rgba(66,255,125,.48);
    box-shadow:
      0 0 0 1px rgba(178,255,206,.10) inset,
      0 0 28px rgba(65,255,120,.26),
      0 0 12px rgba(65,255,120,.22) inset;
  }

  .outer-frame::before,
  .outer-frame::after {
    content: "";
    position: absolute;
    left: 76px;
    right: 76px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(65,255,120,.66), transparent);
    box-shadow: 0 0 16px rgba(65,255,120,.72);
  }

  .outer-frame::before { top: 30px; }
  .outer-frame::after { bottom: 64px; }

  .corner-glow {
    position: absolute;
    width: 112px;
    height: 112px;
    border-color: var(--green);
    border-style: solid;
    filter: drop-shadow(0 0 12px var(--green));
    opacity: .95;
  }

  .corner-glow.tl { top: -1px; left: -1px; border-width: 4px 0 0 4px; border-top-left-radius: 28px; }
  .corner-glow.tr { top: -1px; right: -1px; border-width: 4px 4px 0 0; border-top-right-radius: 28px; }
  .corner-glow.bl { bottom: -1px; left: -1px; border-width: 0 0 4px 4px; border-bottom-left-radius: 28px; }
  .corner-glow.br { bottom: -1px; right: -1px; border-width: 0 4px 4px 0; border-bottom-right-radius: 28px; }

  .bottom-modules {
    position: absolute;
    z-index: 19;
    left: 10%;
    right: 10%;
    bottom: 5.5%;
    height: 64px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid rgba(65,255,120,.25);
    border-radius: 8px;
    background:
      linear-gradient(120deg, rgba(65,255,120,.08), rgba(255,255,255,.035), rgba(65,255,120,.05)),
      rgba(2,14,10,.48);
    box-shadow:
      0 0 28px rgba(65,255,120,.16),
      0 0 0 1px rgba(255,255,255,.045) inset;
    clip-path: polygon(2% 0, 98% 0, 100% 34%, 96% 100%, 4% 100%, 0 34%);
    opacity: 0;
    animation: loadingIn .7s 2.35s ease-out forwards;
  }

  .module {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding-left: 34px;
    color: rgba(228,255,238,.76);
    text-transform: uppercase;
    letter-spacing: 3.2px;
    font-size: 11px;
    line-height: 1.35;
  }

  .module + .module { border-left: 1px solid rgba(65,255,120,.18); }

  .module svg {
    width: 27px;
    height: 27px;
    color: var(--green);
    filter: drop-shadow(0 0 10px rgba(65,255,120,.88));
  }

  @media (max-width: 700px) {
    .hud-left, .hud-right { display: none; }
    .panel { left: 5%; right: 5%; }
    .word .letter { font-size: 94px; }
    .icon { width: 210px; height: 210px; top: 27%; }
    .holo { width: 390px; height: 390px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="panel-glow"></div>
    <div class="panel"></div>
    <div class="outer-frame">
      <span class="corner-glow tl"></span>
      <span class="corner-glow tr"></span>
      <span class="corner-glow bl"></span>
      <span class="corner-glow br"></span>
    </div>
    <canvas id="scene"></canvas>

    <div class="hud-left">
      <div class="hud-title">SYNCERA AI OS</div>
      <div class="hud-small">Initializing system</div>
      <div class="system-list">
        <div class="system-row">Core Systems <span>Online</span></div>
        <div class="system-row">Neural Engine <span>Online</span></div>
        <div class="system-row">Secure Connect <span>Active</span></div>
        <div class="system-row">Data Stream <span>Active</span></div>
      </div>
      <div class="hud-small" style="margin-top:28px;">Status: Optimal</div>
    </div>

    <div class="hud-right">
      <div class="hud-title" style="font-size:14px;">Version 2.5.0</div>
      <div class="hud-small">Build 2505225</div>
      <div style="color:var(--green); letter-spacing:8px; margin-top:8px;">...</div>
      <div class="right-bars"><i></i><i></i><i></i></div>
      <div class="sync">
        <div class="sync-ring"></div>
        <div>System Sync<br>100%</div>
      </div>
    </div>

    <div class="holo">
      <div class="ring one"></div>
      <div class="ring two"></div>
      <div class="ring three"></div>
      <div class="arc"></div>
      <div class="arc two"></div>
      <div class="ticks"></div>
    </div>

    <div class="wave-layer">
      <svg viewBox="0 0 980 190" preserveAspectRatio="none" aria-hidden="true">
        <path class="wave-path faint" d="M0 105 C90 10 170 166 280 82 C388 -2 470 150 585 88 C700 28 790 146 980 52"/>
        <path class="wave-path main" d="M0 105 C90 10 170 166 280 82 C388 -2 470 150 585 88 C700 28 790 146 980 52"/>
        <path class="wave-path low" d="M0 105 C90 10 170 166 280 82 C388 -2 470 150 585 88 C700 28 790 146 980 52"/>
      </svg>
    </div>

    <div class="floor"></div>

    <div class="content">
      <div class="icon">
        <svg class="mark" viewBox="0 0 220 152" fill="none" aria-hidden="true">
          <path d="M8 78 H65 C74 78 75 67 83 67 C93 67 94 118 107 118 C122 118 124 12 137 12 C151 12 147 138 163 138 C177 138 174 66 190 66 C200 66 202 78 212 78" stroke="#baffc8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

    <div class="word" aria-label="SYNCERA">
        <span class="letter" data-l="S">S</span>
        <span class="letter" data-l="Y">Y</span>
        <span class="letter" data-l="N">N</span>
        <span class="letter" data-l="C">C</span>
        <span class="letter" data-l="E">E</span>
        <span class="letter" data-l="R">R</span>
        <span class="letter" data-l="A">A</span>
      </div>
    </div>

    <div class="loading">
      <div class="track"><div class="bar"></div></div>
      <div class="status" id="status">Neural Engine Online</div>
    </div>

    <div class="bottom-modules">
      <div class="module">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.5 2.9 8.4 7 10 4.1-1.6 7-5.5 7-10V6l-7-3Z"/>
          <path d="m9.4 12 1.8 1.8 3.6-4"/>
        </svg>
        <div>Secure<br>Encrypted</div>
      </div>
      <div class="module">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a4 4 0 0 0-4 4v10a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z"/>
          <path d="M8 8H5.8A2.8 2.8 0 0 0 3 10.8v2.4A2.8 2.8 0 0 0 5.8 16H8"/>
          <path d="M16 8h2.2A2.8 2.8 0 0 1 21 10.8v2.4A2.8 2.8 0 0 1 18.2 16H16"/>
          <path d="M12 7v10"/>
        </svg>
        <div>Neural<br>Adaptive</div>
      </div>
      <div class="module">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m13 2-8 12h7l-1 8 8-12h-7l1-8Z"/>
        </svg>
        <div>Performance<br>Peak</div>
      </div>
      <div class="module">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17.5 18H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 11.5 3.5 3.5 0 0 1 17.5 18Z"/>
        </svg>
        <div>Cloud Sync<br>Active</div>
      </div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('scene')
  const ctx = canvas.getContext('2d', { alpha: true })
  const statusEl = document.getElementById('status')
  const dpr = Math.min(2, window.devicePixelRatio || 1)
  let w = 0
  let h = 0

  function resize() {
    const rect = canvas.getBoundingClientRect()
    w = Math.max(1, Math.floor(rect.width))
    h = Math.max(1, Math.floor(rect.height))
    canvas.width = Math.floor(w * dpr)
    canvas.height = Math.floor(h * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }

  resize()
  window.addEventListener('resize', resize)

  const particles = Array.from({ length: 90 }, (_, index) => ({
    x: Math.random(),
    y: Math.random(),
    r: .8 + Math.random() * 3.8,
    a: .12 + Math.random() * .55,
    s: .05 + Math.random() * .16,
    phase: Math.random() * Math.PI * 2,
    color: index % 8 === 0 ? '210,245,255' : '65,255,120',
  }))

  function draw(timeMs) {
    const t = timeMs / 1000
    ctx.clearRect(0, 0, w, h)

    const gx = w * .5 + Math.sin(t * .28) * 18
    const gy = h * .5 + Math.cos(t * .24) * 10
    const glow = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(w, h) * .56)
    glow.addColorStop(0, 'rgba(65,255,120,.16)')
    glow.addColorStop(.36, 'rgba(65,255,120,.045)')
    glow.addColorStop(1, 'rgba(65,255,120,0)')
    ctx.fillStyle = glow
    ctx.fillRect(0, 0, w, h)

    for (const p of particles) {
      const x = ((p.x + t * p.s * .018) % 1) * w
      const y = (p.y + Math.sin(t * .7 + p.phase) * .018) * h
      const pulse = .58 + Math.sin(t * 1.7 + p.phase) * .42
      ctx.beginPath()
      ctx.fillStyle = `rgba(${p.color},${p.a * pulse})`
      ctx.shadowColor = `rgba(${p.color},${p.a})`
      ctx.shadowBlur = 14
      ctx.arc(x, y, p.r, 0, Math.PI * 2)
      ctx.fill()
    }

    ctx.shadowBlur = 0

    const floorY = h * .88
    const reflection = ctx.createLinearGradient(0, h * .60, 0, h)
    reflection.addColorStop(0, 'rgba(65,255,120,0)')
    reflection.addColorStop(.72, 'rgba(65,255,120,.11)')
    reflection.addColorStop(1, 'rgba(65,255,120,0)')
    ctx.fillStyle = reflection
    ctx.fillRect(0, floorY - 120, w, 180)

    requestAnimationFrame(draw)
  }

  requestAnimationFrame(draw)

  const statuses = [
    [0, 'Neural engine online'],
    [5200, 'System stable'],
    [7200, 'Performance peak'],
    [9000, 'Launching SYNCERA'],
  ]

  for (const [delay, text] of statuses) {
    setTimeout(() => {
      const out = statusEl.animate(
        [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-4px)' }],
        { duration: 130, easing: 'ease-out' }
      )
      out.onfinish = () => {
        statusEl.textContent = text
        statusEl.animate(
          [{ opacity: 0, transform: 'translateY(5px)' }, { opacity: 1, transform: 'translateY(0)' }],
          { duration: 180, easing: 'ease-out' }
        )
      }
    }, delay)
  }
</script>
</body>
